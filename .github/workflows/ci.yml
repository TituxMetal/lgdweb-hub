name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun pin lives here and in docker/Dockerfile, and it follows the
          # version local development runs: the three must move together.
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint check
        run: bun run lint:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke the composed server
        run: |
          base_url=http://127.0.0.1:3000
          smoke_dir=$(mktemp -d)

          bun src/server/index.ts &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "$base_url/api/health"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "server never answered $base_url/api/health within 30 attempts"
            exit 1
          fi

          health_status=$(curl --silent --output "$smoke_dir/health.json" --write-out '%{http_code}' "$base_url/api/health")
          health_body=$(cat "$smoke_dir/health.json")
          root_status=$(curl --silent --output "$smoke_dir/root.html" --write-out '%{http_code}' "$base_url/")
          snake_status=$(curl --silent --output "$smoke_dir/snake.html" --write-out '%{http_code}' "$base_url/projects/snake")
          thumbnail_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/thumbnails/snake.webp")
          unknown_status=$(curl --silent --output "$smoke_dir/unknown.html" --write-out '%{http_code}' "$base_url/projects/does-not-exist")
          deep_status=$(curl --silent --output "$smoke_dir/deep.html" --write-out '%{http_code}' "$base_url/projects/chess/01-introduction/01-what-is-chess")

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true

          if [ "$health_status" != 200 ]; then
            echo "GET /api/health returned $health_status, expected 200"
            exit 1
          fi

          if [ "$health_body" != '{"status":"ok"}' ]; then
            echo "GET /api/health body was $health_body, expected {\"status\":\"ok\"}"
            exit 1
          fi

          if [ "$root_status" != 200 ]; then
            echo "GET / returned $root_status, expected 200"
            exit 1
          fi

          if ! grep --quiet '<div id="root">' "$smoke_dir/root.html"; then
            echo 'GET / did not serve the SPA shell: missing <div id="root">'
            exit 1
          fi

          # The build rewrites the apex document's head; `<div id="root">` alone
          # is already in the template, so it cannot tell a rewritten document
          # from one whose rewrite silently stopped running.
          if ! grep --quiet '<!-- lgdweb:metadata -->' "$smoke_dir/root.html" ||
             ! grep --quiet '<meta property="og:url" content="https://lgdweb.fr/">' "$smoke_dir/root.html"; then
            echo 'GET / did not serve the rewritten apex document: missing the metadata marker or og:url'
            exit 1
          fi

          if [ "$snake_status" != 200 ]; then
            echo "GET /projects/snake returned $snake_status, expected 200"
            exit 1
          fi

          if ! grep --quiet '<meta property="og:title" content="Snake Game"' "$smoke_dir/snake.html"; then
            echo 'GET /projects/snake did not serve the project document: missing og:title'
            exit 1
          fi

          if [ "$thumbnail_status" != 200 ]; then
            echo "GET /thumbnails/snake.webp returned $thumbnail_status, expected 200"
            exit 1
          fi

          if [ "$unknown_status" != 200 ]; then
            echo "GET /projects/does-not-exist returned $unknown_status, expected 200 (SPA fallback)"
            exit 1
          fi

          if ! grep --quiet '<div id="root">' "$smoke_dir/unknown.html"; then
            echo 'GET /projects/does-not-exist did not serve the SPA shell: missing <div id="root">'
            exit 1
          fi

          # A feature's own sub-route carries no file, but it must still unfurl as
          # its project rather than as the apex.
          if [ "$deep_status" != 200 ]; then
            echo "GET /projects/chess/01-introduction/01-what-is-chess returned $deep_status, expected 200"
            exit 1
          fi

          if ! grep --quiet '<meta property="og:title" content="Chess Game"' "$smoke_dir/deep.html"; then
            echo 'a deep project sub-route did not serve its project document: missing og:title'
            exit 1
          fi

          echo "GET /api/health -> $health_status $health_body"
          echo 'GET / -> 200 with <div id="root"> and the rewritten apex metadata'
          echo 'GET /projects/snake -> 200 with <meta property="og:title" content="Snake Game"'
          echo "GET /thumbnails/snake.webp -> $thumbnail_status"
          echo 'GET /projects/does-not-exist -> 200 with <div id="root">'
          echo 'GET /projects/chess/01-introduction/01-what-is-chess -> 200 with the Chess Game document'

      - name: No component specs
        run: |
          offenders=$(find src -type f \( -name '*.spec.tsx' -o -name '*.spec.jsx' \))

          if [ -n "$offenders" ]; then
            echo 'React components ship without unit specs; delete these files:'
            printf '%s\n' "$offenders"
            exit 1
          fi

      - name: No stray CSS
        run: |
          # CSS lives in the global styles directory, and a feature — and only a
          # feature — may keep the one stylesheet its original's look needs, directly
          # in its own folder. Nothing nested, nowhere else: a component cannot grow a
          # stylesheet of its own.
          offenders=$(find src -type f -name '*.css' -regextype posix-extended \
            -not -regex 'src/styles/.*\.css|src/features/[^/]+/[^/]+\.css')

          if [ -n "$offenders" ]; then
            echo 'CSS must live under src/styles/ or directly in a feature folder; move these files:'
            printf '%s\n' "$offenders"
            exit 1
          fi

          # And one is the whole allowance: "the one stylesheet its look needs" means a
          # feature folder holds at most one, which a path check cannot see.
          for feature in src/features/*/; do
            [ -d "$feature" ] || continue

            count=$(find "$feature" -maxdepth 1 -type f -name '*.css' 2>/dev/null | wc -l | tr -d ' ')

            if [ "$count" -gt 1 ]; then
              echo "$feature holds $count stylesheets; one is the allowance."
              exit 1
            fi
          done

  docker-check:
    name: Build and boot image (no push)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lgdweb-hub:ci
          cache-from: type=gha

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Kept level with docker/Dockerfile and the validate job; the pin tracks
          # the version local development runs.
          bun-version: 1.3.14

      - name: Boot the built image and probe it
        run: |
          # The image is the artifact that ships, and the checkout is not: the
          # smoke step above runs with every source file present, so an import the
          # runtime stage forgot to copy — `src/shared`, a future sibling — only
          # fails here. Health and one upgrade are what prove the process reached
          # its routes at all.
          container=lgdweb-hub-ci
          base_url=http://127.0.0.1:3000
          probe_dir=$(mktemp -d)

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$probe_dir"
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --publish 3000:3000 lgdweb-hub:ci

          ready=false
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "$base_url/api/health"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "the built image never answered $base_url/api/health"
            docker logs "$container"
            exit 1
          fi

          echo "GET /api/health -> $(curl --silent --fail "$base_url/api/health")"

          # The runtime image is the artifact that ships: this is the only place
          # that proves it carries the build hook's project documents and the
          # copied screenshots, not just the source tree's route table.
          snake_status=$(curl --silent --output "$probe_dir/snake.html" --write-out '%{http_code}' "$base_url/projects/snake")
          thumbnail_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/thumbnails/snake.webp")
          unknown_status=$(curl --silent --output "$probe_dir/unknown.html" --write-out '%{http_code}' "$base_url/projects/does-not-exist")
          root_status=$(curl --silent --output "$probe_dir/root.html" --write-out '%{http_code}' "$base_url/")
          deep_status=$(curl --silent --output "$probe_dir/deep.html" --write-out '%{http_code}' "$base_url/projects/chess/01-introduction/01-what-is-chess")

          if [ "$snake_status" != 200 ]; then
            echo "GET /projects/snake returned $snake_status, expected 200"
            docker logs "$container"
            exit 1
          fi

          if ! grep --quiet '<meta property="og:title" content="Snake Game"' "$probe_dir/snake.html"; then
            echo 'GET /projects/snake did not serve the project document: missing og:title'
            docker logs "$container"
            exit 1
          fi

          if [ "$thumbnail_status" != 200 ]; then
            echo "GET /thumbnails/snake.webp returned $thumbnail_status, expected 200"
            docker logs "$container"
            exit 1
          fi

          if [ "$unknown_status" != 200 ]; then
            echo "GET /projects/does-not-exist returned $unknown_status, expected 200 (SPA fallback)"
            docker logs "$container"
            exit 1
          fi

          if ! grep --quiet '<div id="root">' "$probe_dir/unknown.html"; then
            echo 'GET /projects/does-not-exist did not serve the SPA shell: missing <div id="root">'
            docker logs "$container"
            exit 1
          fi

          if ! grep --quiet '<!-- lgdweb:metadata -->' "$probe_dir/root.html" ||
             ! grep --quiet '<meta property="og:url" content="https://lgdweb.fr/">' "$probe_dir/root.html"; then
            echo 'GET / did not serve the rewritten apex document: missing the metadata marker or og:url'
            docker logs "$container"
            exit 1
          fi

          if [ "$deep_status" != 200 ]; then
            echo "GET /projects/chess/01-introduction/01-what-is-chess returned $deep_status, expected 200"
            docker logs "$container"
            exit 1
          fi

          if ! grep --quiet '<meta property="og:title" content="Chess Game"' "$probe_dir/deep.html"; then
            echo 'a deep project sub-route did not serve its project document: missing og:title'
            docker logs "$container"
            exit 1
          fi

          echo 'GET / -> 200 with the rewritten apex metadata'
          echo 'GET /projects/snake -> 200 with <meta property="og:title" content="Snake Game"'
          echo "GET /thumbnails/snake.webp -> $thumbnail_status"
          echo 'GET /projects/does-not-exist -> 200 with <div id="root">'
          echo 'GET /projects/chess/01-introduction/01-what-is-chess -> 200 with the Chess Game document'

          cat > "$probe_dir/upgrade.js" <<'PROBE'
          const endpoint = 'ws://127.0.0.1:3000/ws/tetris'
          const socket = new WebSocket(endpoint)

          const fail = message => {
            console.error(message)
            process.exit(1)
          }

          const deadline = setTimeout(() => fail(`no upgrade at ${endpoint} within 10s`), 10_000)

          socket.addEventListener('open', () => socket.send(JSON.stringify({ type: 'ping' })))

          socket.addEventListener('message', event => {
            const message = JSON.parse(String(event.data))

            if (message.type !== 'pong') fail(`unexpected frame: ${String(event.data)}`)

            clearTimeout(deadline)
            socket.close()
            console.log('GET /ws/tetris -> upgraded, ping answered with pong')
            process.exit(0)
          })

          socket.addEventListener('error', () => fail(`could not upgrade ${endpoint}`))
          PROBE

          bun run "$probe_dir/upgrade.js"

  docker-publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The floating tags name production: only a default-branch build may
          # move them. A manual dispatch from another ref still publishes its
          # branch and sha tags as a preview, but never overwrites :prod/:latest
          # with code no pull request merged.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
